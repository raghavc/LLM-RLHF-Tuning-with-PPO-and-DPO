model_name_or_path: Qwen/Qwen3-0.6B
sft_model_path: Qwen/Qwen3-0.6B
reward_model_path: outputs/qwen3-reward
dataset_name: trl-lib/tldr
train_split: train
eval_split: validation
test_size: 0.02
output_dir: outputs/qwen3-ppo
use_peft: true
use_rslora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules: all-linear
dtype: bfloat16
bf16: true
learning_rate: 0.000003
total_episodes: 10000
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: true
num_ppo_epochs: 2
num_mini_batches: 1
local_rollout_forward_batch_size: 2
response_length: 256
temperature: 0.8
stop_token: eos
missing_eos_penalty: 1.0
kl_coef: 0.05
kl_estimator: k3
cliprange: 0.2
cliprange_value: 0.2
vf_coef: 0.1
eval_strategy: steps
eval_steps: 100
save_steps: 100
logging_steps: 10
report_to: none
