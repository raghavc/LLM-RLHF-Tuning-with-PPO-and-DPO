model_name_or_path: Qwen/Qwen3-0.6B
dataset_name: trl-lib/ultrafeedback_binarized
train_split: train
eval_split: test
test_size: 0.02
output_dir: outputs/qwen3-dpo
use_peft: true
use_rslora: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.05
lora_target_modules: all-linear
dtype: bfloat16
bf16: true
learning_rate: 0.000005
num_train_epochs: 1
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 8
gradient_checkpointing: true
max_length: 2048
loss_type:
  - sigmoid
beta: 0.1
eval_strategy: steps
eval_steps: 100
save_steps: 100
logging_steps: 10
warmup_ratio: 0.03
report_to: none
