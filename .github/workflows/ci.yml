name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest
      - name: Check command entry points
        run: |
          python -m llm_rlhf.sft --help
          python -m llm_rlhf.reward --help
          python -m llm_rlhf.ppo --help
          python -m llm_rlhf.dpo --help
          python -m llm_rlhf.kto --help
          python -m llm_rlhf.grpo --help
          python -m llm_rlhf.rloo --help
